name: Validate and package Auto-SBC Studio
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Test solver, catalog and local API
        run: python -m pytest -q
      - name: Build and test browser companion
        run: |
          node frontend/build.mjs
          node --test tests/frontend*.cjs
          node --check tampermonkey-ai-sbc.user.js
          node --check backend/static/app.js
      - name: Upload browser extension and userscript
        uses: actions/upload-artifact@v4
        with:
          name: auto-sbc-studio-browser
          path: |
            dist/chrome-extension/
            tampermonkey-ai-sbc.user.js
          retention-days: 14
